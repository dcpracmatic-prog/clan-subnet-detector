[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "clan-subnet-detector"
version = "0.1.0-primitive"
description = "Primitive detector of cliques and isolated subnetworks for cybersecurity and network analysis"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary (see LICENSE)" }
authors = [{ name = "dcpracmatic-prog" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
clan-detect = "examples.synthetic_detection:main"
